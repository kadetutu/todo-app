apiVersion: v1
kind: Pod
metadata:
  name: agent-builder
  namespace: devops-tools
spec:
  serviceAccountName: jenkins-admin
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
  containers:
  - name: node
    image: node:24-alpine
    command:
    - cat
    tty: true
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"
  - name: kaniko
    image: gcr.io/kaniko-project/executor:debug
    securityContext:
      runAsUser: 0
    env:
    - name: DOCKER_CONFIG
      value: /kaniko/.docker
    command:
    - sleep
    args:
    - "9999999"
    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        cpu: "1000m"
        memory: "2Gi"
    volumeMounts:
    - name: docker-config
      mountPath: /kaniko/.docker
  - name: kubectl
    image: bitnami/kubectl:latest
    command:
    - sleep
    args:
    - "9999999"
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"
  volumes:
  - name: docker-config
    secret:
      secretName: docker-credentials
      items:
      - key: .dockerconfigjson
        path: config.json

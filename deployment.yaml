apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app
  namespace: devops-tools
  labels:
    app: todo-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: todo-app
  template:
    metadata:
      labels:
        app: todo-app
    spec:
      containers:
      - name: todo-app
        image: ${DOCKER_REGISTRY}/todo-app:${BUILD_VERSION}
        ports:
        - containerPort: 80
        resources:
          limits:
            cpu: "0.5"
            memory: "512Mi"
          requests:
            cpu: "0.2"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: todo-app-svc
  namespace: devops-tools
spec:
  type: LoadBalancer # Use ClusterIP if routing via Ingress
  selector:
    app: todo-app
  ports:
    - port: 80
      targetPort: 80
